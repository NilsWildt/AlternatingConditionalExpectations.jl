name: CI
on:
  push:
    branches: [master, main, pkg-split]
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version: ['1.12']
        # SimpleKernelRegression pulls in AppleAccelerate; CI runs on the
        # Apple-Silicon runner that matches the verified-green dev environment.
        os: [macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      # Unregistered deps (LocalSmoothers, SimpleKernelRegression) are resolved
      # from the [sources] section of Project.toml during instantiate.
      # NOTE: LocalSmoothers is a private repo — this job needs a PAT with
      # read access exposed as a git credential (the default GITHUB_TOKEN
      # cannot clone other private repos). See repo secrets / SHIPPING notes.
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true
